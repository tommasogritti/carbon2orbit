name = "carbon2orbit-leaderboard"
main = "src/worker.js"
compatibility_date = "2026-11-01"

# The public leaderboard runs at https://lb.carbon2orbit.com. A fork deploying its own copy changes the
# route, the allowed origins and the database id below (see README.md).
workers_dev = false
routes = [{ pattern = "lb.carbon2orbit.com", custom_domain = true }]

# Sites allowed to call the board from a browser, comma-separated. "*.carbon2orbit.pages.dev" covers preview deploys.
[vars]
ALLOWED_ORIGIN = "https://carbon2orbit.com,https://carbon2orbit.pages.dev,*.carbon2orbit.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "carbon2orbit-leaderboard"
database_id = "f6a44518-642a-413b-aa4b-042926b42d80"
